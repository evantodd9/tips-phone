<header class="flex center p-2 bg-slate-700 text-slate-100 sticky top-0 z-100">
  <div class="static left-full">
    <button class="menu-button" (click)="isMenuOpen = !isMenuOpen">
      <span class="material-icons"><img src="assets/icons/menu.svg"></span>
    </button>
  </div>
  <div class="flex-auto w-full justify-center content-center text-center font-bold">
    <h1 class="text-lg">{{title | async }}</h1>
  </div>
</header>

<nav [class.open]="isMenuOpen">
  <a routerLink="/" (click)="isMenuOpen = false"><p class="text-lg font-bold">Home</p></a>
  <a routerLink="/tips" (click)="isMenuOpen = false"><p class="text-lg font-bold">Tips</p></a>
  <a routerLink="/results" (click)="isMenuOpen = false"><p class="text-lg font-bold">Results</p></a>
</nav>

<main>
  <router-outlet></router-outlet>
</main>
