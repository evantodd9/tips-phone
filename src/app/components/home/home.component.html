<div class="overflow-x-auto">
  <table class="w-full text-left table-auto min-w-max">
    <thead>
    <tr>
      <th class="p-4 border-b border-slate-600 bg-slate-700"><p class="text-sm font-normal leading-none text-slate-300">Name</p></th>
      <th class="p-4 border-b border-slate-600 bg-slate-700"><p class="text-sm font-normal leading-none text-slate-300">Total</p></th>
      <th class="p-4 border-b border-slate-600 bg-slate-700"><p class="text-sm font-normal leading-none text-slate-300">Amount</p></th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of tipsTotal">
      <td class="p-4 border-b border-slate-700"><p class="text-base text-slate-700 dark:text-slate-300 font-semibold">{{ item.name }}</p></td>
      <td class="p-4 border-b border-slate-700"><p class="text-base text-slate-700 dark:text-slate-300">{{ item.total }}</p></td>
      <td class="p-4 border-b border-slate-700"><p class="text-base text-slate-700 dark:text-slate-300">{{ item.amount | currency:'USD':'symbol':'1.2-2' }}</p></td>
    </tr>
    </tbody>
  </table>
</div>
