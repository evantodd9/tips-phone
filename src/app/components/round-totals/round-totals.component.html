<div class="table-container">
  <table class="w-full text-left table-auto min-w-max">
    <thead>
    <tr>
      <th class="p-4 border-b border-slate-600 bg-slate-700"><p class="text-sm font-normal leading-none text-slate-300">Name</p></th>
      <th class="p-4 border-b border-slate-600 bg-slate-700"><p class="text-sm font-normal leading-none text-slate-300">Tips</p></th>
      <th class="p-4 border-b border-slate-600 bg-slate-700"><p class="text-sm font-normal leading-none text-slate-300">Bets</p></th>
      <th class="p-4 border-b border-slate-600 bg-slate-700"><p class="text-sm font-normal leading-none text-slate-300">Return</p></th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of roundTotals">
      <td class="p-4 border-b border-slate-700"><p class="text-base text-slate-700 dark:text-slate-300 font-semibold">{{ item.name }}</p></td>
      <td class="p-4 border-b border-slate-700"><p class="text-base text-slate-700 dark:text-slate-300">{{ item.tips }}</p></td>
      <td class="p-4 border-b border-slate-700"><p class="text-base text-slate-700 dark:text-slate-300">{{ item.bets | currency:'USD':'symbol':'1.2-2' }}</p></td>
      <td class="p-4 border-b border-slate-700"><p class="text-base text-slate-700 dark:text-slate-300">{{ item.return | currency:'USD':'symbol':'1.2-2' }}</p></td>
    </tr>
    </tbody>
  </table>
  <div class="grid grid-cols-2 gap-6 pt-10 pl-4 pr-4">
    <button class="w-full py-3 text-white font-extrabold rounded-lg shadow-lg"
            (click)="previousRound()"
            [ngClass]="{'bg-blue-900': round !== 0, 'disabled:opacity-50 disabled:cursor-not-allowed': round === 0}"
            [disabled]="round == 0">Previous</button>
    <button class="w-full py-3 text-white font-extrabold rounded-lg shadow-lg"
            (click)="nextRound()"
            [ngClass]="{'bg-blue-900': round !== max, 'disabled:opacity-50 disabled:cursor-not-allowed': round === max}"
            [disabled]="round == max">Next</button>
  </div>
</div>
